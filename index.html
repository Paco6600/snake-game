<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Spiel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
        }
        h1 {
            margin-bottom: 10px;
            font-size: 2.5rem;
            text-shadow: 0 0 10px #00ff88;
        }
        .score-board {
            display: flex;
            gap: 30px;
            margin-bottom: 15px;
            font-size: 1.2rem;
        }
        #gameCanvas {
            border: 3px solid #00ff88;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
            background: #0f0f1a;
        }
        .controls {
            margin-top: 20px;
            text-align: center;
            color: #aaa;
        }
        .controls p {
            margin: 5px 0;
        }
        #gameOver {
            display: none;
            position: absolute;
            background: rgba(0, 0, 0, 0.85);
            padding: 30px 50px;
            border-radius: 15px;
            text-align: center;
            border: 2px solid #ff4444;
        }
        #gameOver h2 {
            color: #ff4444;
            margin-bottom: 15px;
        }
        button {
            background: #00ff88;
            color: #0f0f1a;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px #00ff88;
        }
        .mobile-controls {
            display: none;
            margin-top: 20px;
            gap: 10px;
        }
        .mobile-controls button {
            width: 60px;
            height: 60px;
            font-size: 1.5rem;
            padding: 0;
        }
        @media (max-width: 600px) {
            .mobile-controls {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
            }
            #gameCanvas {
                width: 90vw;
                height: 90vw;
                max-width: 350px;
                max-height: 350px;
            }
        }
    </style>
</head>
<body>
    <h1>🐍 Snake</h1>
    <div class="score-board">
        <div>Punkte: <span id="score">0</span></div>
        <div>Highscore: <span id="highscore">0</span></div>
    </div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div id="gameOver">
        <h2>Game Over!</h2>
        <p>Punkte: <span id="finalScore">0</span></p>
        <button onclick="restartGame()">Nochmal spielen</button>
    </div>
    <div class="controls">
        <p>Steuerung: Pfeiltasten oder WASD</p>
        <p>Auf Handy: Buttons unten</p>
    </div>
    <div class="mobile-controls">
        <button onclick="setDirection('up')">⬆️</button>
        <div style="display:flex; gap:10px;">
            <button onclick="setDirection('left')">⬅️</button>
            <button onclick="setDirection('down')">⬇️</button>
            <button onclick="setDirection('right')">➡️</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [{x: 10, y: 10}];
        let food = {x: 15, y: 15};
        let dx = 0;
        let dy = 0;
        let score = 0;
        let highscore = localStorage.getItem('snakeHighscore') || 0;
        let gameRunning = true;
        let gameLoop;

        document.getElementById('highscore').textContent = highscore;

        function drawGame() {
            // Clear canvas
            ctx.fillStyle = '#0f0f1a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw snake
            snake.forEach((segment, index) => {
                if (index === 0) {
                    ctx.fillStyle = '#00ff88';
                } else {
                    ctx.fillStyle = '#00cc6a';
                }
                ctx.fillRect(segment.x * gridSize, segment.y * gridSize, gridSize - 2, gridSize - 2);
            });

            // Draw food
            ctx.fillStyle = '#ff4444';
            ctx.beginPath();
            ctx.arc(
                food.x * gridSize + gridSize / 2,
                food.y * gridSize + gridSize / 2,
                gridSize / 2 - 2,
                0,
                Math.PI * 2
            );
            ctx.fill();
        }

        function moveSnake() {
            if (!gameRunning) return;

            const head = {x: snake[0].x + dx, y: snake[0].y + dy};

            // Wall collision
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                endGame();
                return;
            }

            // Self collision
            for (let segment of snake) {
                if (head.x === segment.x && head.y === segment.y) {
                    endGame();
                    return;
                }
            }

            snake.unshift(head);

            // Eat food
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                document.getElementById('score').textContent = score;
                if (score > highscore) {
                    highscore = score;
                    localStorage.setItem('snakeHighscore', highscore);
                    document.getElementById('highscore').textContent = highscore;
                }
                placeFood();
            } else {
                snake.pop();
            }

            drawGame();
        }

        function placeFood() {
            food = {
                x: Math.floor(Math.random() * tileCount),
                y: Math.floor(Math.random() * tileCount)
            };
            // Make sure food is not on snake
            for (let segment of snake) {
                if (food.x === segment.x && food.y === segment.y) {
                    placeFood();
                    return;
                }
            }
        }

        function endGame() {
            gameRunning = false;
            clearInterval(gameLoop);
            document.getElementById('finalScore').textContent = score;
            document.getElementById('gameOver').style.display = 'block';
        }

        function restartGame() {
            snake = [{x: 10, y: 10}];
            dx = 0;
            dy = 0;
            score = 0;
            document.getElementById('score').textContent = score;
            document.getElementById('gameOver').style.display = 'none';
            gameRunning = true;
            placeFood();
            drawGame();
            gameLoop = setInterval(moveSnake, 120);
        }

        function setDirection(dir) {
            if (!gameRunning && (dx !== 0 || dy !== 0)) return;
            switch(dir) {
                case 'up':
                    if (dy !== 1) { dx = 0; dy = -1; }
                    break;
                case 'down':
                    if (dy !== -1) { dx = 0; dy = 1; }
                    break;
                case 'left':
                    if (dx !== 1) { dx = -1; dy = 0; }
                    break;
                case 'right':
                    if (dx !== -1) { dx = 1; dy = 0; }
                    break;
            }
        }

        document.addEventListener('keydown', (e) => {
            switch(e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    setDirection('up');
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    setDirection('down');
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    setDirection('left');
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    setDirection('right');
                    break;
            }
        });

        // Start game
        placeFood();
        drawGame();
        gameLoop = setInterval(moveSnake, 120);
    </script>
</body>
</html>
